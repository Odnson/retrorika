<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Component Demo</title>

   <!-- Import Maps -->
   <script type="importmap">
   {
      "imports": {
         "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
         "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.14.1/+esm",
         "gsap/ScrollTrigger": "https://cdn.jsdelivr.net/npm/gsap@3.14.1/ScrollTrigger/+esm",
         "gsap/SplitText": "https://cdn.jsdelivr.net/npm/gsap@3.14.1/SplitText/+esm",
         "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.3.21/+esm"
      }
   }
   </script>

   <!-- Connected Styles -->
   <link rel="stylesheet" href="style.css" />
</head>

<body>
   <!-- ===== HTML ===== -->
   <section class="hero">
      <div class="hero__row">
         <img class="hero__bg" src="img/hero-bg.webp" alt="Hero Background">
         
         <div class="hero__twigs">
            <img class="hero__twig hero__twig--left" src="img/mask-1.webp" alt="">
            <img class="hero__twig hero__twig--right" src="img/mask-2.webp" alt="">
         </div>

         <div class="hero__top">
            <h1>IRONHILL</h1>
            <p>Craft Beer & Dining</p>
         </div>

         <div class="hero__content">
            <h2>Experience the perfect blend of handcrafted beers and exceptional cuisine in a warm, inviting atmosphere</h2>
         </div>

         <canvas class="hero-canvas"></canvas>
      </div>
   </section>

   <!-- ======================= -->

   <!-- Connected script -->
   <script type="module" src="script.js"></script>
</body>

</html>
